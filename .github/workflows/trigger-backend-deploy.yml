name: Trigger backend deploy

# This admin SPA is served from MarrowFresh.Backend's wwwroot, so it has no
# deployment of its own. A change here has to redeploy the backend, which is
# what builds and bundles this app. Verify the build first, then dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trigger-backend-deploy
  cancel-in-progress: true

jobs:
  verify-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Build here as a gate. If the admin doesn't compile, don't kick off a
      # backend deploy that would only fail later and burn a release slot.
      - name: Verify admin builds
        env:
          VITE_API_BASE: ''
        run: |
          npm ci
          npm run build

      # Needs a PAT with repo scope on MarrowFresh.Backend.
      - name: Dispatch backend deploy
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.BACKEND_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MarrowFresh/MarrowFresh.Backend/dispatches \
            -d '{"event_type":"admin-updated","client_payload":{"sha":"${{ github.sha }}"}}' \
            --fail-with-body
          echo "Dispatched admin-updated to MarrowFresh.Backend"
